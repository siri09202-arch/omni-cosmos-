<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNI COSMOS 3D Universe Simulator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; overflow: hidden; }
        canvas { display: block; margin: auto; }
    </style>
</head>
<body>
    <canvas id="universe"></canvas>
    <script>
        // Basic setup for OMNI COSMOS 3D universe simulator
        const canvas = document.getElementById('universe');
        const context = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        function drawStar(x, y, color) {
            context.beginPath();
            context.arc(x, y, 2, 0, Math.PI * 2);
            context.fillStyle = color;
            context.fill();
        }

        function drawUniverse() {
            context.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < 100; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const color = `hsl(${Math.random() * 360}, 100%, 50%)`;
                drawStar(x, y, color);
            }
        }

        setInterval(drawUniverse, 1000);
    </script>
</body>
</html>
